<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Form đặt hàng</title>

<link rel="stylesheet" href="style.css">

</head>
<body>
<div class="container"> 
    <form id="orderForm">
    <h2>Form đặt hàng</h2>
    <label>Tên sản phẩm:</label>
    <select id="product">
    <option value="">-- Chọn sản phẩm --</option>
    <option value="Áo">Áo</option>
    <option value="Quần">Quần</option>
    <option value="Giày">Giày</option>
    </select>
    <span class="error" id="productError"></span>

    <br><br>

    <label>Số lượng:</label>
    <input type="number" id="quantity">
    <span class="error" id="quantityError"></span>

    <br><br>

    <label>Ngày giao hàng:</label>
    <input type="date" id="date">
    <span class="error" id="dateError"></span>

    <br><br>

    <label>Địa chỉ giao:</label>
    <input type="text" id="address">
    <span class="error" id="addressError"></span>

    <br><br>

    <label>Ghi chú:</label><br>
    <textarea id="note"></textarea><br>

    <span id="noteCount">0/200</span>
    <span class="error" id="noteError"></span>

    <br><br>

    <label>Phương thức thanh toán:</label><br>

    <div class="payment">

        <label>
        <input type="radio" name="pay" value="COD">
        COD
        </label>

        <label>
        <input type="radio" name="pay" value="Chuyển khoản">
        Chuyển khoản
        </label>

        <label>
        <input type="radio" name="pay" value="Ví điện tử">
        Ví điện tử
        </label>

    </div>

    <span class="error" id="payError"></span>

    <br><br>

    <h3>Tổng tiền: <span id="total">0</span> VNĐ</h3>

    <button type="submit">Đặt hàng</button>

    </form>

    <div id="confirmBox">

    <h3>Xác nhận đơn hàng</h3>

    <p id="confirmInfo"></p>

    <button id="confirmBtn">Xác nhận</button>
    <button id="cancelBtn">Huỷ</button>

    </div>
</div>  
<script src="script.js"></script>

</body>
</html>
